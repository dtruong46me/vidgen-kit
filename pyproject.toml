[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidgen"
version = "0.1.0"
description = "A programmable, code-first video editing engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx"]
render = ["moviepy", "pillow"]
subtitle = ["faster-whisper", "srt"]
# design/automation/api all import vidgen.design.script, which imports
# vidgen.strategies.subtitle unconditionally (FileSubtitleSource needs
# `srt`, Whisper/HybridSubtitleSource need `faster-whisper`) -- so all
# three need the subtitle extra's packages too, even if captions aren't
# actually used.
design = ["pydantic", "pyyaml", "faster-whisper", "srt"]
automation = ["pydantic", "pyyaml", "moviepy", "pillow", "faster-whisper", "srt"]
api = ["pydantic", "pyyaml", "moviepy", "pillow", "faster-whisper", "srt", "fastapi", "uvicorn[standard]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: opt-in tests that download/run a real Whisper model (deselect with -m 'not slow')",
]

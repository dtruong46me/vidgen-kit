[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidgen"
version = "0.1.0"
description = "A programmable, code-first video editing engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
render = ["moviepy", "pillow"]
subtitle = ["faster-whisper", "srt"]
design = ["pydantic", "pyyaml"]
automation = ["pydantic", "pyyaml", "moviepy", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: opt-in tests that download/run a real Whisper model (deselect with -m 'not slow')",
]
